name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build arm64 APK and publish release
    uses: ./.github/workflows/flutter-ci.yml
    with:
      flutter-version: "3.50.0"
      java-version: "25"
      android-compile-sdk: "36"
      android-plugin-sdk: "35"
      android-build-tools: "36.0.0"
      release: true
      target-platform: "android-arm64"
    secrets: inherit
