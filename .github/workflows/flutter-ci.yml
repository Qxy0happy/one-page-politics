name: Flutter reusable CI

on:
  workflow_call:
    inputs:
      flutter-version:
        description: Flutter SDK version
        required: true
        type: string
      java-version:
        description: Temurin JDK major version
        required: true
        type: string
      android-compile-sdk:
        description: Android compileSdk / platform version
        required: true
        type: string
      android-plugin-sdk:
        description: Android platform required by plugins (jni_flutter)
        required: true
        type: string
      android-build-tools:
        description: Android build-tools version
        required: true
        type: string
      release:
        description: Build and publish a GitHub Release
        required: false
        type: boolean
        default: false
      target-platform:
        description: Flutter target platform (e.g. android-arm64); empty builds all ABIs
        required: false
        type: string
        default: ""
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
      RELEASE_CERT_SHA256:
        required: false

jobs:
  ci:
    name: Analyze, test, build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: ${{ inputs.flutter-version }}
      JAVA_VERSION: ${{ inputs.java-version }}
      ANDROID_COMPILE_SDK: ${{ inputs.android-compile-sdk }}
      ANDROID_PLUGIN_SDK: ${{ inputs.android-plugin-sdk }}
      ANDROID_BUILD_TOOLS: ${{ inputs.android-build-tools }}
      ANDROID_CMAKE_VERSION: "3.22.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore release keystore
        if: ${{ inputs.release }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?缺少 KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?缺少 KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?缺少 KEY_ALIAS}"
          : "${KEY_PASSWORD:?缺少 KEY_PASSWORD}"
          mkdir -p app/android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/android/app/release.keystore
          chmod 600 app/android/app/release.keystore
          cat > app/android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 app/android/key.properties

      - name: Prepare cache directories
        shell: bash
        run: mkdir -p .ci-toolchain/toolchain .ci-toolchain/deps

      - name: Restore toolchain cache
        uses: actions/cache@v6
        with:
          path: .ci-toolchain/toolchain
          key: ci-toolchain-${{ runner.os }}-flutter-${{ inputs.flutter-version }}-jdk-${{ inputs.java-version }}-android-${{ inputs.android-compile-sdk }}-plugin-${{ inputs.android-plugin-sdk }}-${{ inputs.android-build-tools }}
          restore-keys: |
            ci-toolchain-${{ runner.os }}-flutter-${{ inputs.flutter-version }}-

      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: .ci-toolchain/deps
          key: ci-deps-${{ runner.os }}-${{ hashFiles('app/pubspec.lock', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ci-deps-${{ runner.os }}-

      - name: Prepare base tools
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip xz-utils zip ninja-build

      - name: Install or reuse JDK, Flutter and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE:-$PWD}/.ci-toolchain"
          TOOLCHAIN="$ROOT/toolchain"
          DEPS="$ROOT/deps"
          mkdir -p "$TOOLCHAIN" "$DEPS"
          export JAVA_HOME="$TOOLCHAIN/jdk25"
          export FLUTTER_HOME="$TOOLCHAIN/flutter"
          export ANDROID_HOME="$TOOLCHAIN/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PUB_CACHE="$DEPS/pub-cache"
          export GRADLE_USER_HOME="$DEPS/gradle"
          mkdir -p "$JAVA_HOME" "$FLUTTER_HOME" "$ANDROID_HOME" "$PUB_CACHE" "$GRADLE_USER_HOME"

          if [ -x "$JAVA_HOME/bin/java" ]; then
            echo "toolchain: reuse JDK ${JAVA_VERSION}"
          else
            echo "toolchain: install JDK ${JAVA_VERSION}"
            curl -fsSL -o /tmp/jdk.tar.gz \
              "https://api.adoptium.net/v3/binary/latest/${JAVA_VERSION}/ga/linux/x64/jdk/hotspot/normal/eclipse"
            tar -xzf /tmp/jdk.tar.gz -C "$JAVA_HOME" --strip-components=1
          fi

          if [ -x "$FLUTTER_HOME/bin/flutter" ]; then
            echo "toolchain: reuse Flutter ${FLUTTER_VERSION}"
          else
            echo "toolchain: install Flutter ${FLUTTER_VERSION}"
            curl -fsSL -o /tmp/flutter.tar.xz \
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            tar -xJf /tmp/flutter.tar.xz -C "$TOOLCHAIN"
          fi

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "toolchain: reuse Android cmdline-tools"
          else
            echo "toolchain: install Android cmdline-tools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi

          export PATH="$JAVA_HOME/bin:$FLUTTER_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          if [ -d "$ANDROID_HOME/platforms/android-${ANDROID_COMPILE_SDK}" ] && \
             [ -d "$ANDROID_HOME/platforms/android-${ANDROID_PLUGIN_SDK}" ] && \
             [ -d "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}" ] && \
             [ -d "$ANDROID_HOME/cmake/${ANDROID_CMAKE_VERSION}" ]; then
            echo "toolchain: reuse Android platform/build-tools/cmake"
          else
            echo "toolchain: install Android SDK packages"
            yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
            sdkmanager --sdk_root="$ANDROID_HOME" \
              "platform-tools" \
              "platforms;android-${ANDROID_COMPILE_SDK}" \
              "platforms;android-${ANDROID_PLUGIN_SDK}" \
              "build-tools;${ANDROID_BUILD_TOOLS}" \
              "cmake;${ANDROID_CMAKE_VERSION}"
          fi

          cat > "$ROOT/env.sh" <<'EOF'
          export TOOLCHAIN_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export TOOLCHAIN="${TOOLCHAIN_ROOT}/toolchain"
          export DEPS="${TOOLCHAIN_ROOT}/deps"
          export JAVA_HOME="${TOOLCHAIN}/jdk25"
          export FLUTTER_HOME="${TOOLCHAIN}/flutter"
          export ANDROID_HOME="${TOOLCHAIN}/android-sdk"
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export PUB_CACHE="${DEPS}/pub-cache"
          export GRADLE_USER_HOME="${DEPS}/gradle"
          export PATH="${JAVA_HOME}/bin:${FLUTTER_HOME}/bin:${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/cmdline-tools/latest/bin:${PATH}"
          EOF
          source "$ROOT/env.sh"
          git config --global --add safe.directory "$FLUTTER_HOME"
          flutter config --no-analytics >/dev/null 2>&1 || true
          java -version
          flutter --version
          sdkmanager --version

      - name: Install dependencies
        shell: bash
        run: |
          source "$GITHUB_WORKSPACE/.ci-toolchain/env.sh"
          cd app
          flutter pub get

      - name: Validate release tag
        if: ${{ inputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_LINE="$(awk '/^version:/{print $2; exit}' app/pubspec.yaml)"
          VERSION_NAME="${VERSION_LINE%%+*}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION_NAME" = "$TAG_VERSION" ] || {
            echo "tag $GITHUB_REF_NAME 与 app/pubspec.yaml 的 $VERSION_LINE 不一致" >&2
            exit 1
          }

      - name: Analyze, test, build and verify
        shell: bash
        env:
          TARGET_PLATFORM: ${{ inputs.target-platform }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
          RELEASE_BUILD: ${{ inputs.release }}
        run: |
          source "$GITHUB_WORKSPACE/.ci-toolchain/env.sh"
          if [ "${RELEASE_BUILD}" = "true" ]; then
            : "${RELEASE_CERT_SHA256:?release 构建缺少 RELEASE_CERT_SHA256}"
          fi
          ./tools/check.sh

      - name: Publish GitHub release
        if: ${{ inputs.release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.ci-toolchain/env.sh"
          VERSION_LINE="$(awk '/^version:/{print $2; exit}' app/pubspec.yaml)"
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE##*+}"
          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          [ -f "$APK" ] || { echo "缺少 $APK" >&2; exit 1; }
          mkdir -p build/release
          ASSET_NAME="one-page-politics-$VERSION_NAME.apk"
          cp "$APK" "build/release/$ASSET_NAME"
          (cd build/release && sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256")
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET_NAME}"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          MIN_SDK="$("$BUILD_TOOLS/aapt2" dump badging "$APK" | sed -n -e "s/^minSdkVersion:'\([0-9]*\)'.*/\1/p" -e "s/^sdkVersion:'\([0-9]*\)'.*/\1/p" | head -1)"
          MIN_SDK="${MIN_SDK:-24}"
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" || true)"
          [ -n "$NOTES" ] || NOTES="内容更新与稳定性改进"
          APK="build/release/$ASSET_NAME" \
          VERSION_NAME="$VERSION_NAME" \
          VERSION_CODE="$VERSION_CODE" \
          MIN_SDK="$MIN_SDK" \
          ASSET_NAME="$ASSET_NAME" \
          DOWNLOAD_URL="$DOWNLOAD_URL" \
          NOTES="$NOTES" \
          OUTPUT="build/release/update.json" \
          ./tools/make_update_manifest.sh
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "build/release/$ASSET_NAME" \
              "build/release/$ASSET_NAME.sha256" \
              "build/release/update.json" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "build/release/$ASSET_NAME" \
              "build/release/$ASSET_NAME.sha256" \
              "build/release/update.json" \
              --title "一页纸 $VERSION_NAME" \
              --notes "$NOTES" \
              --verify-tag
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: one-page-politics-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove release keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f app/android/app/release.keystore app/android/key.properties
