name: CI

on:
  push:
    branches:
      - main
      - device-tts-release
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter CI
    uses: ./.github/workflows/flutter-ci.yml
    with:
      flutter-version: "3.50.0"
      java-version: "25"
      android-compile-sdk: "36"
      android-build-tools: "36.0.0"
